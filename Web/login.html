<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <title>Đăng nhập | Maid AI</title>
        <link rel="stylesheet" href="/Web/css/style.css" />
        <link rel="stylesheet" href="/Web/css/auth.css" />
        <!-- <link rel="stylesheet" href="/Web/css/chat.css"/> -->
    </head>
    <body id="login-page-body" class="body-account">
        <div class="container-account">
            <h2>Đăng nhập</h2>
            <input
                type="text"
                id="username"
                class="input-field"
                placeholder="Username"
            />
            <!-- <span class="error-message" id="error-message-username"></span> -->
            <input
                type="password"
                id="password"
                class="input-field"
                placeholder="Password"
            />
            <span class="error-message" id="error-message"></span>
            <button id="button-login" class="button">Login</button>
            <div class="switch">
                <a href="/Web/register.html">Chưa có tài khoản? Đăng ký</a>
            </div>
        </div>

        <script src="/Web/js/config.js"></script>
        <script src="/Web/js/main.js"></script>
        <script src="/Web/js/utils.js"></script>
        <script src="/Web/js/auth.js"></script>
        <!-- <script src="/Web/js/chat_demo.js"></script> -->
    </body>
</html>
